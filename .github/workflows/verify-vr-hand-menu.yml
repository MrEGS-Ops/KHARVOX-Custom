name: KHARVOX VR Hand Calibration Unit Tests

on:
  push:
    branches:
      - work/in-headset-weapon-hand-calibration
      - work/manager-187-wheel-holsters
      - fix/manager-187-heavy-alt-grip-hip-zones
      - fix/rs-hand-focus-use-interactions
      - fix/calibration-live-secondary-fire
      - fix/gunslinger-weapon-hand-only-hip-assign
      - fix/rs-native-interaction-and-held-altfire
      - fix/always-hand-focus-normal-gameplay
      - feature/userdata-calibration-factory-defaults
      - feature/live-vr-mod-calibration-menu
      - fix/nov12-hud-factory-pointer
      - feature/nov13-headset-test-polish
    paths:
      - 'src/openxr/RightHandGripConfig.h'
      - 'src/openxr/VrHandMenuPolicy.h'
      - 'config/user_calibration_defaults/**'
      - 'src/openxr/VrHandMenuInput.inc'
      - 'src/openxr/VrLiveModsConfig.h'
      - 'src/openxr/VrLiveMenuLogic.inc'
      - 'src/openxr/VrHandMenuRender.inc'
      - 'tests/vr_live_mods_config_tests.cpp'
      - 'tests/right_hand_grip_config_tests.cpp'
      - 'src/weapon/QuickHolsterPolicy.h'
      - 'tests/quick_holster_policy_tests.cpp'
      - 'tests/vr_menu_navigation_tests.cpp'
      - 'src/openxr/PhysicalGlorykillMeleePolicy.h'
      - 'src/openxr/HandFocusPolicy.h'
      - 'tests/hand_focus_policy_tests.cpp'
      - 'tests/physical_glorykill_melee_policy_tests.cpp'
      - '.github/workflows/verify-vr-hand-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vr-hand-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone live VR mod calibration and toggle regressions
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/vr_live_mods_config_tests.cpp -o /tmp/vr-live-tests
      - name: Verify precise capture, default-preserving overrides and saved live toggles
        run: /tmp/vr-live-tests
      - name: Compile isolated per-weapon profile regression tests
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/right_hand_grip_config_tests.cpp -o /tmp/vr-hand-config-tests
      - name: Validate left/right profiles, reset and right-click hold shortcut
        run: /tmp/vr-hand-config-tests
      - name: Compile direct Gunslinger hip-holster regression tests
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/quick_holster_policy_tests.cpp -o /tmp/quick-hip-tests
      - name: Validate immediate left/right native-selection plans and confirmed equip handoff
        run: /tmp/quick-hip-tests
      - name: Compile left-stick A/B VR menu navigation tests
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/vr_menu_navigation_tests.cpp -o /tmp/vr-menu-nav-tests
      - name: Verify left/right columns, A/B edge controls and calibration action targets
        run: /tmp/vr-menu-nav-tests
      - name: Compile persistent hand focus and native execution exceptions regression
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/hand_focus_policy_tests.cpp -o /tmp/hand-focus-policy-tests
      - name: Verify normal gameplay stays weapon-hand aimed and execution focus is head
        run: /tmp/hand-focus-policy-tests
      - name: Compile physical GK and Hand Focus USE routing regression
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/physical_glorykill_melee_policy_tests.cpp -o /tmp/focus-use-tests
      - name: Verify RS Hand Focus USE survives Physical GK without JOY8 melee
        run: /tmp/focus-use-tests
