name: KHARVOX VR Mod Manager (Experimental)

on:
  push:
    branches:
      - work/mods-sidecar-separation
      - work/cactus-original-launcher-mods-button
      - work/manager-187-wheel-holsters
    paths:
      - 'launcher/KharvoxMods/**'
      - 'launcher/KharvoxModsUpdater/**'
      - 'launcher/KharvoxLauncher/**'
      - '.github/workflows/build-kharvox-mods.yml'
      - 'docs/KHARVOX-MODS-STANDALONE.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kharvox-mods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mods-standalone:
    runs-on: windows-latest
    steps:
      - name: Checkout standalone integration branch
        uses: actions/checkout@v4

      - name: Restore KHARVOX VR Mod Manager
        shell: pwsh
        run: dotnet restore launcher/KharvoxMods/KharvoxMods.csproj

      - name: Build original MrEGS application icon from embedded PNG
        shell: pwsh
        run: ./launcher/KharvoxMods/Generate-MrEGSIcon.ps1

      - name: Fetch and verify CC0 Twitch unlock jingle
        shell: pwsh
        run: |
          $file = "launcher/KharvoxMods/twitch-unlock.wav"
          $source = "https://raw.githubusercontent.com/Beatscribe/homebrew_vgm/5a82f88b87bb442499685c494b7a96278121b4c7/GB/fanfares/wav/treasure.wav"
          Invoke-WebRequest -Uri $source -OutFile $file -MaximumRedirection 2
          if ((git hash-object $file).Trim() -ne "a579e15ab70e4e0b8884e7c4504bb6d7cb4fdb64") {
            throw "Twitch cue fails pinned CC0 audio integrity check"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
          if ($bytes.Length -lt 44 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne "RIFF" -or
              [Text.Encoding]::ASCII.GetString($bytes, 8, 4) -ne "WAVE") {
            throw "Twitch cue is not WAV audio"
          }

      - name: Compile standalone executable (net48 x64)
        shell: pwsh
        run: dotnet build launcher/KharvoxMods/KharvoxMods.csproj --configuration Release --no-restore -p:InformationalVersion=${{ github.run_id }}

      - name: Restore native-bridge-aware KHARVOX launcher
        shell: pwsh
        run: dotnet restore launcher/KharvoxLauncher/KharvoxLauncher.csproj

      - name: Build native-bridge-aware KHARVOX launcher
        shell: pwsh
        run: dotnet build launcher/KharvoxLauncher/KharvoxLauncher.csproj --configuration Release --no-restore

      - name: Verify exactly two opt-in bridge mod flags
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-standalone-gestures" -PassThru -Wait -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Behind-head wheel and quick holster bridge tests failed" }

      - name: Verify embedded launcher scales to avoid scrollbars
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe"
          $result = Start-Process -FilePath $exe -ArgumentList "--self-test-embedded-layout" -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -ne 0) { throw "Embedded viewport fit regression" }

      - name: Verify Cactus v1.1.1 original launcher UI is completely unmodified
        shell: pwsh
        run: |
          $originalSha = "fdfdd46536a68853612b7ce5a0d2418541a60586"
          $actualSha = (git hash-object "launcher/KharvoxLauncher/MainForm.cs").Trim()
          if ($actualSha -ne $originalSha) {
            throw "Cactus original MainForm.cs changed; launcher UI must stay untouched"
          }
          $project = Get-Content -LiteralPath "launcher/KharvoxLauncher/KharvoxLauncher.csproj" -Raw
          if ($project -notmatch 'Compile Remove="MainForm\.\*\.cs"') {
            throw "Legacy custom Mods partial files may be compiled into launcher"
          }
          $launcherExe = Join-Path $PWD "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe"
          $result = Start-Process -FilePath $launcherExe -ArgumentList "--self-test-cactus-launcher" -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -ne 0) { throw "Original launcher Mods isolation failed" }

      - name: Assemble optional verified KHARVOX native bridge copy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = Join-Path $PWD "dist/native-base"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          # Pin the native runtime to the last verified working native build.
          gh run download 40463514160 --repo MrEGS-Ops/KHARVOX-Custom --name KHARVOX-Full-Build --dir $base
          if ($LASTEXITCODE -ne 0) { throw "Could not download verified native KHARVOX core" }
          $manifest = Join-Path $base "PATCH-BUILD.txt"
          if (!(Test-Path $manifest) -or
              !((Get-Content -LiteralPath $manifest -Raw) -match "commit=9e30175531524c308d38d61c43b0fe2b1f16c6e4")) {
            throw "Downloaded native build does not match the approved working commit"
          }
          if (!(Test-Path (Join-Path $base "KharvoxLayer.dll"))) {
            throw "Verified native layer missing"
          }
          Copy-Item -LiteralPath "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe" -Destination $base -Force
          if (Test-Path "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe.config") {
            Copy-Item -LiteralPath "launcher/KharvoxLauncher/bin/Release/net48/KharvoxLauncher.exe.config" -Destination $base -Force
          }
          @(
            "KHARVOX_MODS_BRIDGE_V1"
            "baseNativeCommit=9e30175531524c308d38d61c43b0fe2b1f16c6e4"
            "bridgeLauncherCommit=${{ github.sha }}"
            "launcherUi=cactus-original-v1.1.1-unmodified-ui-v2"
          ) | Set-Content -LiteralPath (Join-Path $base "KharvoxModsBridge.v1") -Encoding ascii
          $zip = Join-Path $PWD "dist/KHARVOX-Mods-NativeBridge.zip"
          Compress-Archive -Path (Join-Path $base "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *KHARVOX-Mods-NativeBridge.zip" |
            Set-Content -LiteralPath ($zip + ".sha256") -Encoding ascii

      - name: Restore portable updater
        shell: pwsh
        run: dotnet restore launcher/KharvoxModsUpdater/KharvoxModsUpdater.csproj

      - name: Build portable updater EXE
        shell: pwsh
        run: dotnet build launcher/KharvoxModsUpdater/KharvoxModsUpdater.csproj --configuration Release --no-restore

      - name: Verify original MrEGS icon in Mods and Updater executables
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourceSha = (git hash-object launcher/KharvoxMods/mregs-logo.png).Trim()
          if ($sourceSha -ne "46d1856bbec1e8d65f9965a96f9a72c1dba4588c") {
            throw "MrEGS logo asset changed unexpectedly"
          }
          $paths = @(
            "launcher/KharvoxMods/bin/Release/net48/KharvoxVRModManager.exe",
            "launcher/KharvoxModsUpdater/bin/Release/net48/KharvoxVRModManagerUpdater.exe"
          )
          $digests = @()
          foreach ($path in $paths) {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Join-Path $PWD $path))
            if ($null -eq $icon) { throw "Missing MrEGS icon: $path" }
            try {
              $bitmap = $icon.ToBitmap()
              try {
                $red = 0
                $pixels = New-Object byte[] ($bitmap.Width * $bitmap.Height * 4)
                for ($y=0; $y -lt $bitmap.Height; $y++) {
                  for ($x=0; $x -lt $bitmap.Width; $x++) {
                    $color = $bitmap.GetPixel($x,$y)
                    [BitConverter]::GetBytes($color.ToArgb()).CopyTo(
                      $pixels, 4 * ($y * $bitmap.Width + $x))
                    if ($color.R -gt 130 -and $color.R -gt ($color.G * 1.6) -and $color.R -gt ($color.B * 1.4)) { $red++ }
                  }
                }
                if ($red -lt 1) { throw "MrEGS red accent missing: $path" }
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $digests += [Convert]::ToBase64String($sha.ComputeHash($pixels)) }
                finally { $sha.Dispose() }
              } finally { $bitmap.Dispose() }
            } finally { $icon.Dispose() }
          }
          if ($digests[0] -ne $digests[1]) { throw "Mods and Updater icons differ" }

      - name: Test portable updater without network or live installation
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxModsUpdater/bin/Release/net48/KharvoxVRModManagerUpdater.exe"
          if (!(Test-Path $exe)) { throw "Updater executable missing" }
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Portable updater self-test failed: $($test.ExitCode)" }

      - name: Verify four-digit updater window layout
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxModsUpdater/bin/Release/net48/KharvoxVRModManagerUpdater.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-ui" -PassThru -Wait -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Compact updater window regression: $($test.ExitCode)" }

      - name: Verify fresh install and fail-closed attachment consent
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxMods/bin/Release/net48/KharvoxVRModManager.exe"
          if (!(Test-Path $exe)) { throw "Standalone KHARVOX Mods executable missing" }
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Standalone app self-test failed: $($test.ExitCode)" }

      - name: Verify original Custom Mods layout and all 22 rows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxMods/bin/Release/net48/KharvoxVRModManager.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-ui" -PassThru -Wait -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Legacy two-panel layout regression: $($test.ExitCode)" }

      - name: Stamp current successful build identifier
        shell: pwsh
        run: |
          Set-Content -LiteralPath "launcher/KharvoxMods/bin/Release/net48/build-info.txt" -Value "${{ github.run_id }}" -Encoding ASCII

      - name: Assemble isolated standalone package
        shell: pwsh
        run: |
          $inputDir = Join-Path $PWD "launcher/KharvoxMods/bin/Release/net48"
          $destination = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-Standalone"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $inputDir "KharvoxVRModManager.exe") $destination
          Copy-Item (Join-Path $inputDir "build-info.txt") $destination
          $updater = Join-Path $PWD "launcher/KharvoxModsUpdater/bin/Release/net48/KharvoxVRModManagerUpdater.exe"
          Copy-Item $updater $destination
          if (Test-Path (Join-Path $inputDir "KharvoxVRModManager.exe.config")) {
            Copy-Item (Join-Path $inputDir "KharvoxVRModManager.exe.config") $destination
          }
          Copy-Item "docs/KHARVOX-MODS-STANDALONE.md" (Join-Path $destination "README.md")
          # The verified custom KHARVOX is ready to run on first launch.
          $bundledRuntime = Join-Path $destination "NativeBridge"
          Copy-Item -LiteralPath (Join-Path $PWD "dist/native-base") -Destination $bundledRuntime -Recurse -Force
          foreach ($required in @("KharvoxLauncher.exe", "KharvoxLayer.dll", "KharvoxModsBridge.v1")) {
            if (!(Test-Path (Join-Path $bundledRuntime $required))) {
              throw "Ready-to-run custom KHARVOX payload missing: $required"
            }
          }
          if (Test-Path (Join-Path $destination "KharvoxLauncher.exe")) {
            throw "Standalone package must not bundle or overwrite the KHARVOX launcher"
          }
          if (Test-Path (Join-Path $destination "KharvoxLayer.dll")) {
            throw "Standalone package must not contain a patched KHARVOX runtime"
          }

      - name: Package ready-to-run standalone with bundled custom KHARVOX
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-Standalone"
          $readyZip = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-ReadyToRun.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $readyZip -CompressionLevel Optimal -Force
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $readyZip).Hash.ToLowerInvariant()
          "$digest *KHARVOX-VR-Mod-Manager-ReadyToRun.zip" |
            Set-Content -LiteralPath ($readyZip + ".sha256") -Encoding ascii

      - name: Build verified public updater release ZIP and checksum
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-Standalone"
          $releaseZip = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-Standalone.zip"
          # Include only managed application files and preserve portable settings.
          # The new EXE embeds the build ID and stamps build-info.txt on launch.
          $releaseFiles = @("KharvoxVRModManager.exe", "README.md")
          if (Test-Path (Join-Path $packageDir "KharvoxVRModManager.exe.config")) {
            $releaseFiles += "KharvoxVRModManager.exe.config"
          }
          # Updater EXE is not self-updated while running.
          $paths = @($releaseFiles | ForEach-Object { Join-Path $packageDir $_ })
          Compress-Archive -LiteralPath $paths -DestinationPath $releaseZip -CompressionLevel Optimal -Force
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseZip).Hash.ToLowerInvariant()
          "$digest *KHARVOX-VR-Mod-Manager-Standalone.zip" |
            Set-Content -LiteralPath ($releaseZip + ".sha256") -Encoding ascii
          # Permanent versioned asset filenames avoid old ZIP vs new checksum
          # being served by GitHub's CDN at the same mutable download URL.
          $versionedName = "KHARVOX-VR-Mod-Manager-Standalone-${{ github.run_id }}.zip"
          $versionedZip = Join-Path $PWD ("dist/" + $versionedName)
          Copy-Item -LiteralPath $releaseZip -Destination $versionedZip
          "$digest *$versionedName" |
            Set-Content -LiteralPath ($versionedZip + ".sha256") -Encoding ascii
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $versionedZip).Hash.ToLowerInvariant() -ne $digest) {
            throw "Immutable updater ZIP checksum changed before publishing"
          }

      - name: Create separately verified updater self-refresh package
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "launcher/KharvoxModsUpdater/bin/Release/net48/KharvoxVRModManagerUpdater.exe"
          $zip = Join-Path $PWD "dist/KHARVOX-VR-Mod-Manager-Updater.zip"
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *KHARVOX-VR-Mod-Manager-Updater.zip" |
            Set-Content -LiteralPath ($zip + ".sha256") -Encoding ascii

      - name: Upload KHARVOX VR Mod Manager preview
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-VR-Mod-Manager-Preview
          path: dist/KHARVOX-VR-Mod-Manager-Standalone
          retention-days: 14

      - name: Publish verified ZIP for automatic download
        # Keep build #187's public release and existing updater untouched while testing.
        if: github.ref == 'refs/heads/work/cactus-original-launcher-mods-button'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kharvox-mods-standalone-preview
          name: "KHARVOX VR Mod Manager — Build #${{ github.run_id }}"
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            KHARVOX VR Mod Manager — An Unofficial VR Mod Manager for KHARVOX.
            Independent mod manager by MrEGS; original KHARVOX launcher by CactusVRStudios.
            Download KHARVOX-VR-Mod-Manager-ReadyToRun.zip, extract and run KharvoxVRModManager.exe.
            Updates: run KharvoxVRModManagerUpdater.exe with the manager closed.
            This release uses only the new executable names. Original KHARVOX files are not overwritten.
          files: |
            dist/KHARVOX-VR-Mod-Manager-ReadyToRun.zip
            dist/KHARVOX-VR-Mod-Manager-ReadyToRun.zip.sha256
            dist/KHARVOX-VR-Mod-Manager-Standalone.zip
            dist/KHARVOX-VR-Mod-Manager-Standalone.zip.sha256
            dist/KHARVOX-VR-Mod-Manager-Standalone-*.zip
            dist/KHARVOX-VR-Mod-Manager-Standalone-*.zip.sha256
            dist/KHARVOX-Mods-NativeBridge.zip
            dist/KHARVOX-Mods-NativeBridge.zip.sha256
            dist/KHARVOX-VR-Mod-Manager-Updater.zip
            dist/KHARVOX-VR-Mod-Manager-Updater.zip.sha256
