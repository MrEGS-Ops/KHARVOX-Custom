# Off-Hand Grip: right weapon-hand anchor adjustment for Gauss Cannon / Chaingun
# Edit in NOTEPAD and restart DOOM to apply.
# Values are metres in GUN-LOCAL coordinates: +X right, +Y up, -Z forward.
# Max distance from the weapon controller = 0.85 metres in total. Adjust in 0.01 m steps.
# Global height correction is applied ONLY when two-hand support Grip is latched.
# The older right-hand lock anchored at the controller centre, too high
# for the existing glove meshes. 0.08 lowers the visible primary hand by 8 cm
# along the solved GUN's local down axis, without changing weapon aim.
# Fine-tune from 0.00 (off) to 0.20 in 0.01 metre (1 cm) steps.
right_hand_drop_m = 0.08
# Other measured Gauss/Chaingun offsets remain separate.
# Neutral values are intentional: in-game fitting is required.
# Examples: gauss_cannon = -0.03 0.05 -0.02
#           chaingun = 0.02 0.00 -0.04
gauss_cannon = 0.00 0.00 0.00
chaingun = 0.00 0.00 0.00
