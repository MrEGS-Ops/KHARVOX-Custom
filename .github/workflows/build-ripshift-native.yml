name: RIPSHIFT Native Build

on:
  push:
    # Packaging-only changes do not need to rebuild the native runtime.
    # Full native builds still run for source/tooling or launcher changes.
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      # Owner grip factory defaults are embedded into KharvoxLayer's
      # CalibrationDefaults directory. Their edits require fresh native build.
      - 'config/user_calibration_defaults/**'
      - 'tests/**'
      - 'launcher/KharvoxLauncher/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build-ripshift-native.yml'
    branches: [clean/custom-core, audit/mod-fixes-no-build, work/custom-mod-priority-order-no-build, work/custom-mod-ui-compact-doom-drag-no-build, work/haptic-overhaul-prototype-no-build, work/launcher-oct11-feedback-polish, work/launcher-182-polish, work/full-integrated-sfs-build, work/vr-wheel-holster-crouch-dash-fixes, work/oct13-ui-and-gameplay-feedback, work/oct13-followup-regression-fixes, work/oct14-restore-native-fast-kills, work/oct17-back-of-hand-hud-prototype, work/oct17-action-hz-isolation-gauss-guard-no-build, work/oct17-action-speed-ui-cleanup, work/oct17-speed-selector-trim, work/oct17-doom-save-protection, work/oct17-scripted-cinematic-native-timing, work/oct18-scripted-cinematic-execution-tail-guard, work/oct18-rs-story-cinematic-fast-forward, work/oct18-optional-action-exit-and-story-skip-diagnostics, work/oct18-three-action-presets-native-scripted, work/oct18-rs-story-free-walk, work/oct18-story-focus-native-pythonfree-generator, work/oct18-uninterrupted-story-auto-release, work/oct18-ledge-blink-live-hmd-story-logs, work/oct18-focus-action-tail-camera-continuity, work/oct18-auto-suspend-camera-focus-on-actions, work/oct18-generator-index-name-diagnostics, work/oct18-major-story-focus-and-ai-field-fix, work/oct18-gk-700ms-handoff, work/oct18-gk-150ms-handoff, work/oct18-live-motion-chainsaw-hz, work/manager-187-wheel-holsters, fix/manager-187-heavy-alt-grip-hip-zones, feature/live-vr-mod-calibration-menu, fix/nov12-hud-factory-pointer, feature/weapon-rear-proximity-fade-793, feature/nov13-headset-test-polish, feature/onehand-physical-recoil-calibration, feature/userdata-structured-migration-20261117, feature/object-discovery-cleanup-20261122, feature/object-discovery-full-grip-calibration-20261123]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ripshift-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Parse all PowerShell shipping scripts before building
        shell: powershell
        run: |
          foreach ($script in @(
              "tools/verify_sfs_payload.ps1",
              "tools/Restore-Cactus-SFS-Profile.ps1",
              "tools/Inspect-DoomWorldPhysics.ps1"
          )) {
            if ($script.EndsWith(".py")) { continue }
            $tokens = $null
            $problems = $null
            $source = (Resolve-Path -LiteralPath $script).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $source, [ref]$tokens, [ref]$problems) | Out-Null
            if ($problems.Count -ne 0) {
              foreach ($problem in $problems) { Write-Error "$script : $problem" }
              throw "PowerShell syntax validation failed: $script"
            }
            Write-Host "PASS: $script parses correctly"
          }

      - name: Validate DOOM trace candidate hook signatures
        shell: powershell
        run: python tests/verify_native_world_grab_signatures.py

      - name: Test Object Discovery settings and model-profile integrity
        shell: powershell
        run: |
          cmake -S . -B build/discovery-tests -A x64 -DKHARVOX_BUILD_LAYER=OFF -DKHARVOX_BUILD_SFS_COMPILER=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "Discovery test configure failed" }
          cmake --build build/discovery-tests --config Release --target KharvoxObjectDiscoverySettingsPolicyTests KharvoxObjectGripProfileStoreTests
          if ($LASTEXITCODE -ne 0) { throw "Discovery test compile failed" }
          ctest --test-dir build/discovery-tests -C Release --output-on-failure -R "^(object-discovery-radius-and-reach|object-grip-profile-identity-and-roundtrip)$"
          if ($LASTEXITCODE -ne 0) { throw "Discovery policy tests failed" }

      - name: Compile read-only DOOM physics inspector
        shell: powershell
        run: |
          & ./tools/Inspect-DoomWorldPhysics.ps1 -ValidateOnly
          if (-not $?) { throw "Physics inspector compile check failed" }

      - name: Test RIPSHIFT resource mod generator and immersion inventory
        shell: powershell
        run: |
          python tools/Generate-RIPSHIFT-Mods.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Original resource mod generator self-test failed" }
          python tools/Probe-RIPSHIFT-Immersion.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Original immersion resource inventory test failed" }

      - name: Regenerate controller mapping
        shell: powershell
        run: .\assets\branding\generate-controller-mapping.ps1

      - name: Restore launcher
        shell: powershell
        run: dotnet restore launcher\KharvoxLauncher\KharvoxLauncher.csproj

      - name: Build launcher Release
        shell: powershell
        run: dotnet build launcher\KharvoxLauncher\KharvoxLauncher.csproj --configuration Release --no-restore

      - name: Test malformed VR mod settings preservation
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-custom-settings" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "VR mod settings self-test failed: $($test.ExitCode)" }

      - name: Verify copy-only UserData migration and rollback compatibility
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-userdata" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "UserData migration self-test failed: $($test.ExitCode)" }

      - name: Verify RIPSHIFT launch profile defaults and fixed controls
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-ripshift-profile" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "MrEGS_ launch profile self-test failed: $($test.ExitCode)" }

      - name: Test modified launcher Gunslinger Shoulder Weapon UI
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-shoulder-weapon-lock" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Gunslinger Shoulder Weapon UI smoke test failed: $($test.ExitCode)" }

      - name: Test separate launcher Virtual Gunstock UI lock
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-virtual-gunstock-lock" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Virtual Gunstock helper lock regression failed" }

      - name: Verify upstream Cactus v1.1.1 hand HUD restoration
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\\KharvoxLauncher\\bin\\Release\\net48\\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-cactus-hand-hud" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Original Cactus v1.1.1 hand-HUD backup/default restoration failed: $($test.ExitCode)" }

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache
          key: kharvox-vcpkg-${{ runner.os }}-x64-windows-static-md-v1

      - name: Compile and run native input and gameplay policy tests
        shell: powershell
        run: |
          cmake -S tests/policy -B build/gesture-policy -A x64
          if ($LASTEXITCODE -ne 0) { throw "Gesture policy configure failed" }
          cmake --build build/gesture-policy --config Release
          if ($LASTEXITCODE -ne 0) { throw "Gesture policy compile failed" }
          ctest --test-dir build/gesture-policy -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Gesture policy tests failed" }

      - name: Restore native incremental cache
        uses: actions/cache@v4
        with:
          path: build/native
          key: kharvox-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kharvox-native-${{ runner.os }}-

      - name: Install SFS compiler dependencies
        # On a vcpkg baseline update, SPIRV-Tools rebuilds both Debug and
        # Release (roughly 10+ minutes) before binaries can be cached.
        timeout-minutes: 25
        shell: powershell
        run: |
          $triplet = "x64-windows-static-md"
          $binaryCache = Join-Path $PWD ".vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "spirv-cross:$triplet" "glslang:$triplet" "spirv-tools:$triplet"
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          if (!(Test-Path "$root\include\spirv_cross\spirv_glsl.hpp")) { throw "SPIRV-Cross headers missing" }
          if (!(Test-Path "$root\lib\spirv-cross-glsl.lib")) { throw "SPIRV-Cross glsl lib missing" }
          if (!(Test-Path "$root\include\glslang\Include\glslang_c_interface.h")) { throw "glslang headers missing" }
          if (!(Test-Path "$root\lib\glslang.lib")) { throw "glslang lib missing" }
          "KHARVOX_VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure native
        shell: powershell
        run: cmake -S . -B build/native -A x64 -DKHARVOX_BUILD_LAYER=ON -DKHARVOX_BUILD_SFS_COMPILER=ON -DBUILD_TESTING=OFF -DKHARVOX_EXPERIMENTAL_WORLD_GRAB=OFF "-DKHARVOX_SPIRV_CROSS_SOURCE=$env:KHARVOX_VCPKG_ROOT\include\spirv_cross" "-DKHARVOX_SPIRV_CROSS_LIB=$env:KHARVOX_VCPKG_ROOT\lib" "-DKHARVOX_GLSLANG_ROOT=$env:KHARVOX_VCPKG_ROOT"

      - name: Build native Release
        shell: powershell
        run: cmake --build build/native --config Release --parallel

      - name: Verify native SFS stamp
        shell: powershell
        run: |
          $layer = "build\native\Release\KharvoxLayer.dll"
          $stamp = "build\native\Release\native_sfs_build.txt"
          if (!(Test-Path $layer)) { throw "KharvoxLayer.dll missing" }
          if (!(Test-Path $stamp)) { throw "native_sfs_build.txt missing" }
          $lines = Get-Content $stamp
          $hash = (Get-FileHash -Algorithm SHA256 $layer).Hash
          if ($lines.Count -ne 2 -or $lines[0] -ne "KHARVOX_NATIVE_SFS_1" -or $lines[1] -ne $hash) { throw "SFS capability stamp mismatch" }

      # Both DLL variants are built from the SAME source commit. The normal
      # Native Full/Patch uploads stay strictly WORLD_GRAB=OFF. The additional
      # ON artifact is downloaded ONLY by RIPSHIFT VR (Experimental).
      - name: Configure experimental World Grab runtime
        shell: powershell
        run: cmake -S . -B build/experimental -A x64 -DKHARVOX_BUILD_LAYER=ON -DKHARVOX_BUILD_SFS_COMPILER=ON -DBUILD_TESTING=OFF -DKHARVOX_EXPERIMENTAL_WORLD_GRAB=ON "-DKHARVOX_SPIRV_CROSS_SOURCE=$env:KHARVOX_VCPKG_ROOT\include\spirv_cross" "-DKHARVOX_SPIRV_CROSS_LIB=$env:KHARVOX_VCPKG_ROOT\lib" "-DKHARVOX_GLSLANG_ROOT=$env:KHARVOX_VCPKG_ROOT"

      - name: Compile experimental World Grab DLL
        shell: powershell
        run: cmake --build build/experimental --config Release --target KharvoxLayer --parallel

      - name: Verify distinct experimental DLL and SFS stamp
        shell: powershell
        run: |
          $base = "build/native/Release/KharvoxLayer.dll"
          $experimental = "build/experimental/Release/KharvoxLayer.dll"
          $stamp = "build/experimental/Release/native_sfs_build.txt"
          if (!(Test-Path $base) -or !(Test-Path $experimental) -or !(Test-Path $stamp)) { throw "One runtime DLL or experimental SFS stamp missing" }
          $baseHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $base).Hash.ToLowerInvariant()
          $experimentalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $experimental).Hash.ToLowerInvariant()
          if ($baseHash -eq $experimentalHash) { throw "Experimental and native runtimes are identical: compiled World Grab split missing" }
          $lines = @(Get-Content -LiteralPath $stamp)
          if ($lines.Count -ne 2 -or $lines[0] -ne "KHARVOX_NATIVE_SFS_1" -or $lines[1].ToLowerInvariant() -ne $experimentalHash) { throw "Experimental SFS capability stamp mismatch" }
          $stage = "out/experimental-world-grab"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $experimental -Destination "$stage/KharvoxLayer.dll" -Force
          Copy-Item -LiteralPath $stamp -Destination "$stage/native_sfs_build.txt" -Force
          @(
            "RIPSHIFT_EXPERIMENTAL_WORLD_GRAB_1"
            "commit=${{ github.sha }}"
            "experimental_sha256=$experimentalHash"
            "native_sha256=$baseHash"
          ) | Set-Content -Encoding ascii -LiteralPath "$stage/EXPERIMENTAL-WORLD-GRAB-STAMP.txt"

      - name: Test DOOM user mod discovery and selection persistence
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-user-mods" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "User mod discovery self-test failed: $($test.ExitCode)" }

      - name: Test DOOM save protection copy/hash integrity
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-save-protection" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "DOOM save protection self-test failed: $($test.ExitCode)" }

      - name: Test DOOM mod staging and patch ownership
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-doom-staging" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "DOOM staging self-test failed: $($test.ExitCode)" }

      - name: Test active DML resource collision rejection
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-doom-overlap" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "DML overlap self-test failed: $($test.ExitCode)" }

      - name: Test independent DOOM resource patch writer
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-resource-patcher" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "KHARVOX patch writer self-test failed: $($test.ExitCode)" }

      - name: Test native DOOM resource generator and index name aliases
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-native-mod-generator" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Native resource generator regression tests failed: $($test.ExitCode)" }

      - name: Test conservative mod config merging
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-config-merge" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "KHARVOX config merge self-test failed: $($test.ExitCode)" }

      - name: Test remembered good/bad configuration states
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-config-marks" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Configuration marks self-test failed: $($test.ExitCode)" }

      - name: Test ZIP and unpacked mod content identities
        shell: powershell
        run: |
          $exe = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48\KharvoxLauncher.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test-mod-fingerprints" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Mod fingerprint test failed: $($test.ExitCode)" }

      - name: Assemble full install and patch
        shell: powershell
        run: |
          $native = Join-Path $PWD "build\native\Release"
          $launcher = Join-Path $PWD "launcher\KharvoxLauncher\bin\Release\net48"
          $out = Join-Path $PWD "out\ripshift"
          $full = Join-Path $out "full"
          $patch = Join-Path $out "patch"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $full,$patch | Out-Null
          Copy-Item -Path (Join-Path $native "*") -Destination $full -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $launcher "KharvoxLauncher.exe") -Destination $full -Force
          Copy-Item -LiteralPath (Join-Path $launcher "KharvoxLauncher.exe.config") -Destination $full -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $full "assets\branding") | Out-Null
          Copy-Item -LiteralPath "assets\branding\quest-controller-mapping.png" -Destination (Join-Path $full "assets\branding\quest-controller-mapping.png") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $full "tools") | Out-Null
          Copy-Item -LiteralPath "tools\Generate-RIPSHIFT-Mods.py" -Destination (Join-Path $full "tools\Generate-RIPSHIFT-Mods.py") -Force
          foreach ($name in @("KharvoxLayer.dll","KharvoxLayer.json","native_sfs_build.txt","offhand_hud_default.cfg")) {
            $source = Join-Path $native $name
            if (!(Test-Path $source)) { throw "Patch source missing: $name" }
            Copy-Item -LiteralPath $source -Destination $patch -Force
          }
          foreach ($name in @("KharvoxLauncher.exe","KharvoxLauncher.exe.config")) {
            $source = Join-Path $launcher $name
            if (!(Test-Path $source)) { throw "Patch source missing: $name" }
            Copy-Item -LiteralPath $source -Destination $patch -Force
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $patch "tools") | Out-Null
          Copy-Item -LiteralPath "tools\Generate-RIPSHIFT-Mods.py" -Destination (Join-Path $patch "tools\Generate-RIPSHIFT-Mods.py") -Force

          # Supervisor is only used by a paused mod; Freedoom face art is not consumed by gameplay.
          # Neither belongs in the native artifacts or the lightweight retail distribution.
          foreach ($package in @($full,$patch)) {
            foreach ($excluded in @("assets/freedoom","assets/freedom","KharvoxSupervisor.exe","KharvoxSupervisor.exe.config","KharvoxSupervisor.json","supervisor-profiles")) {
              if (Test-Path -LiteralPath (Join-Path $package $excluded)) { throw "Unused runtime asset packaged: $excluded" }
            }
          }

          # Provision only the original upstream SFS profile, NOT Cactus's
          # launcher/game binaries or any settings. The release ZIP is pinned
          # by SHA256 in our audited restore utility. Fail closed if download,
          # archive identity, shader validation or staging fails.
          $upstreamUrl = "https://github.com/CactusVRStudios/KHARVOX/releases/download/v1.1.1/KHARVOX-v1.11.zip"
          $sourceZip = Join-Path $env:RUNNER_TEMP "KHARVOX-Cactus-v1.11.zip"
          Invoke-WebRequest -Uri $upstreamUrl -UseBasicParsing -OutFile $sourceZip
          foreach ($package in @($full, $patch)) {
            & ./tools/Restore-Cactus-SFS-Profile.ps1 -InstallRoot $package -ReleaseZip $sourceZip
            # The restore function throws on error; it does not set LASTEXITCODE.
            $sourceNotice = @(
              "KHARVOX SFS SHADER PROFILE - ORIGINAL RELEASE"
              "Source: CactusVRStudios/KHARVOX v1.1.1"
              "Official release: $upstreamUrl"
              "Original ZIP SHA256: 79666be1c330b7a737c2e2766b2207557ace7c9b453194972719ef3693dd4dc5"
              "Only 75 shader profile files were extracted, no upstream executables or configuration."
              "Original project: https://github.com/CactusVRStudios/KHARVOX"
              "DOOM and any game-derived material retain their respective rights; do not assume general reuse rights from this package."
            )
            $sourceNotice | Set-Content -LiteralPath (Join-Path $package "SFS-PROFILE-SOURCE.txt") -Encoding UTF8
            & ./tools/verify_sfs_payload.ps1 -PackageRoot $package -RequireComplete
            if ($LASTEXITCODE -ne 0) { throw "Integrated SFS validation failed: $package" }
          }
          function Write-Manifest([string]$root,[string]$kind) {
            $files = @()
            Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1).Replace('\','/')
              $files += [ordered]@{ path=$relative; size=$_.Length; sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
            }
            $manifest = [ordered]@{ schema=1; kind=$kind; run="${{ github.run_number }}"; commit="${{ github.sha }}"; branch="${{ github.ref_name }}"; createdUtc=(Get-Date).ToUniversalTime().ToString("o"); files=$files }
            $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 -LiteralPath (Join-Path $root "PATCH-MANIFEST.json")
            @("RIPSHIFT_NATIVE_BUNDLE_1","kind=$kind","run=${{ github.run_number }}","commit=${{ github.sha }}") | Set-Content -Encoding ascii -LiteralPath (Join-Path $root "PATCH-BUILD.txt")
          }
          # Strict packaging is already checked above. Never upload a release
          # that would be blocked immediately by VulkanSfs.EnsureAvailable().
          foreach ($package in @($full, $patch)) {
            & ./tools/verify_sfs_payload.ps1 -PackageRoot $package -RequireComplete
            if ($LASTEXITCODE -ne 0) { throw "SFS packaging incomplete: $package" }
            if (!(Test-Path -LiteralPath (Join-Path $package "KharvoxLauncher.exe"))) {
              throw "Launcher missing from integrated package: $package"
            }
          }
          "RIPSHIFT native build: FULL and PATCH include 75 validated SFS shader replacements." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Manifest $full "full"
          Write-Manifest $patch "patch"

      - name: Upload full install
        uses: actions/upload-artifact@v4
        with:
          name: RIPSHIFT-Native-Full
          path: out/ripshift/full
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload fast patch
        uses: actions/upload-artifact@v4
        with:
          name: RIPSHIFT-Native-Patch
          path: out/ripshift/patch
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload experimental-only World Grab DLL
        uses: actions/upload-artifact@v4
        with:
          name: RIPSHIFT-Experimental-World-Grab-Layer
          path: out/experimental-world-grab
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Keep only latest 5 successful builds
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "RIPSHIFT-Build-Retention"
          }
          $base = "https://api.github.com/repos/${{ github.repository }}"
          $workflow = "${{ github.workflow_ref }}".Split("@")[0].Split("/")[-1]
          $branch = [Uri]::EscapeDataString("${{ github.ref_name }}")
          $uri = "$base/actions/workflows/$workflow/runs?branch=$branch&status=success&per_page=100"
          $runs = @((Invoke-RestMethod -Headers $headers -Uri $uri).workflow_runs |
            Sort-Object run_number -Descending)

          $keep = 5
          if ($runs.Count -le $keep) {
            Write-Host "Only $($runs.Count) successful builds exist; nothing to delete."
            exit 0
          }

          # User-requested known-good rollback checkpoint: Native #1256
          # and Experimental #713 both passed for this exact immutable SHA.
          # Never delete this run in the latest-five cleanup. The source is
          # pinned separately on backup/world-grab-pre-integration-green-20261118.
          $rollbackSha = "724a42710f4d650082d8ef934d9bbccc48945967"
          foreach ($run in ($runs | Select-Object -Skip $keep)) {
            if ([int64]$run.id -eq [int64]"${{ github.run_id }}") { continue }
            if ($run.head_sha -eq $rollbackSha) {
              Write-Host "Preserving user-requested green rollback build #$($run.run_number) SHA=$rollbackSha"
              continue
            }
            Write-Host "Deleting old successful build run #$($run.run_number) id=$($run.id)"
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "$base/actions/runs/$($run.id)"
          }
