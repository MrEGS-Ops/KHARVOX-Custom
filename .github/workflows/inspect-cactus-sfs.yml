name: Inspect original KHARVOX SFS runtime assets

on:
  push:
    branches: [work/sfs-cactus-release-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-original-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read official Cactus release ZIP without executing code
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, sys, urllib.request, zipfile
          sources = [
              ("v1.1.1", "KHARVOX-v1.11.zip"),
              ("v1.1.0", "KHARVOX-v1.1.zip"),
              ("v1.0.3", "KHARVOX-v1.03.zip"),
          ]
          report = []
          complete = None
          for tag, filename in sources:
              url = "https://github.com/CactusVRStudios/KHARVOX/releases/download/" + tag + "/" + filename
              entry = {"tag": tag, "file": filename, "url": url}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"KHARVOX-SFS-Provenance-Audit/1"})
                  with urllib.request.urlopen(req, timeout=100) as rsp:
                      raw = rsp.read(70 * 1024 * 1024 + 1)
                  if len(raw) > 70 * 1024 * 1024: raise ValueError("Archive exceeds audit cap")
                  entry["archive_size"] = len(raw)
                  entry["archive_sha256"] = hashlib.sha256(raw).hexdigest()
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      candidates = [n for n in z.namelist() if n.lower().endswith(".spv") and "sfs-profile/" in n.lower().replace("\\","/")]
                      entry["profile_shader_count"] = len(candidates)
                      entry["profile_paths"] = sorted(candidates)[:8]
                      entry["all_spv_count"] = len([n for n in z.namelist() if n.lower().endswith(".spv")])
                      if len(candidates) == 75:
                          details = []
                          for n in sorted(candidates):
                              b = z.read(n)
                              if len(b) < 20 or len(b) % 4 or b[:4] != b"\x03\x02\x23\x07":
                                  raise ValueError("Invalid SPIR-V: " + n)
                              details.append({"filename": n.rsplit("/",1)[-1], "size": len(b), "sha256": hashlib.sha256(b).hexdigest()})
                          entry["validated_spirv"] = 75
                          entry["profile_bytes"] = sum(x["size"] for x in details)
                          entry["profile_hashes"] = details
                          complete = entry
                  report.append(entry)
                  print("RELEASE", tag, "SFS count", entry.get("profile_shader_count"), "all SPVs", entry.get("all_spv_count"), "ZIP bytes", entry["archive_size"], flush=True)
                  if complete: break
              except Exception as exc:
                  entry["error"] = type(exc).__name__+": "+str(exc)
                  print("RELEASE", tag, "ERROR", entry["error"], flush=True)
                  report.append(entry)
          with open("cactus_sfs_provenance_report.json", "w") as f:
              json.dump({"source":"CactusVRStudios/KHARVOX official releases","results":report},f,indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Cactus official KHARVOX SFS inspection\n\n")
              for e in report:
                  f.write("- "+e["tag"]+": "+str(e.get("profile_shader_count","unavailable"))+" profile shaders; "+str(e.get("error","no errors"))+"\n")
              f.write("\n**Result:** "+("75 valid shaders in "+complete["tag"] if complete else "No complete verified profile located") +"\n")
          sys.exit(0 if complete else 1)
          PY
      - name: Upload metadata report only (never game shaders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-sfs-audit-metadata
          path: cactus_sfs_provenance_report.json
          if-no-files-found: ignore
