name: KHARVOX Retail Preview (Experimental)

on:
  push:
    branches: [feature/onehand-physical-recoil-calibration]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'config/user_calibration_defaults/**'
      - 'launcher/KharvoxLauncher/**'
      - 'launcher/KharvoxMods/**'
      - 'launcher/KharvoxModsUpdater/**'
      - 'supervisor/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build-custom.yml'
      - '.github/workflows/build-kharvox-mods.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kharvox-retail-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-preview:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source and full provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest matching successful native build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ github.ref_name }}"
          if ($branch -ne "feature/onehand-physical-recoil-calibration") { throw "Unexpected retail preview source branch." }
          $repo = "${{ github.repository }}"
          $nativePaths = @("src","tests","CMakeLists.txt","config/user_calibration_defaults","launcher/KharvoxLauncher","supervisor","tools","assets",".github/workflows/build-custom.yml")
          $selected = $null
          for ($attempt = 1; $attempt -le 120 -and $null -eq $selected; $attempt++) {
            $raw = gh run list --repo $repo --workflow build-custom.yml --branch $branch --limit 100 --json databaseId,headSha,headBranch,conclusion,status
            if ($LASTEXITCODE -ne 0) { throw "Cannot query KHARVOX native builds." }
            foreach ($candidate in @($raw | ConvertFrom-Json)) {
              if ($candidate.headBranch -ne $branch -or $candidate.conclusion -ne "success") { continue }
              git merge-base --is-ancestor $candidate.headSha "${{ github.sha }}"
              if ($LASTEXITCODE -ne 0) { continue }
              git diff --quiet $candidate.headSha "${{ github.sha }}" -- $nativePaths
              if ($LASTEXITCODE -eq 0) { $selected = $candidate; break }
            }
            if ($null -eq $selected) { Write-Host "Waiting for a green same-source native build: $attempt/120"; Start-Sleep -Seconds 15 }
          }
          if ($null -eq $selected) { throw "No successful matching native build; refusing to package stale gameplay." }
          "NATIVE_RUN_ID=$($selected.databaseId)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NATIVE_COMMIT=$($selected.headSha)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified native build $($selected.databaseId) at $($selected.headSha)"

      - name: Assemble single-launcher KHARVOX package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $PWD "dist/KHARVOX-Retail-Preview"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $metadata = gh run view $env:NATIVE_RUN_ID --repo "${{ github.repository }}" --json headSha,headBranch,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.conclusion -ne "success" -or $metadata.headSha -ne $env:NATIVE_COMMIT -or $metadata.headBranch -ne "${{ github.ref_name }}") { throw "Native source verification failed." }
          gh run download $env:NATIVE_RUN_ID --repo "${{ github.repository }}" --name KHARVOX-Full-Build --dir $root
          if ($LASTEXITCODE -ne 0) { throw "Verified native runtime download failed." }
          foreach ($required in @("KharvoxLauncher.exe","KharvoxLayer.dll","KharvoxLayer.json","PATCH-BUILD.txt","PATCH-MANIFEST.json","native_sfs_build.txt","KharvoxSupervisor.exe")) {
            if (!(Test-Path -LiteralPath (Join-Path $root $required))) { throw "Missing essential native runtime file: $required" }
          }
          $stamp = Get-Content -LiteralPath (Join-Path $root "PATCH-BUILD.txt") -Raw
          $provenance = Get-Content -LiteralPath (Join-Path $root "PATCH-MANIFEST.json") -Raw | ConvertFrom-Json
          if (!$stamp.Contains("KHARVOX_CUSTOM_WATCHER_1") -or !$stamp.Contains("kind=full") -or !$stamp.Contains("commit=$env:NATIVE_COMMIT") -or $provenance.kind -ne "full" -or $provenance.commit -ne $env:NATIVE_COMMIT -or $provenance.branch -ne "${{ github.ref_name }}") { throw "Native SHA/branch manifest mismatch." }
          if (Test-Path -LiteralPath (Join-Path $root "UserData")) { throw "Developer UserData was bundled unexpectedly." }
          if (Test-Path -LiteralPath (Join-Path $root "NativeBridge")) { throw "Legacy manager NativeBridge wrapper was bundled." }
          $factory = Join-Path $root "CalibrationDefaults"
          New-Item -ItemType Directory -Force -Path $factory | Out-Null
          $defaults = @(Get-ChildItem -LiteralPath "config/user_calibration_defaults" -File)
          if ($defaults.Count -ne 7) { throw "Missing owner-calibrated factory settings." }
          foreach ($file in $defaults) {
            $target = Join-Path $factory $file.Name
            if (Test-Path -LiteralPath $target) {
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash) { throw "Factory file conflict: $($file.Name)" }
            } else { Copy-Item -LiteralPath $file.FullName -Destination $target }
          }
          foreach ($obsolete in @("Get-KHARVOX-Custom-Watcher.ps1","KharvoxVRModManager.exe","KharvoxVRModManagerUpdater.exe","KharvoxModsBridge.v1","PATCH-BUILD.txt","PATCH-MANIFEST.json")) {
            Remove-Item -LiteralPath (Join-Path $root $obsolete) -Force -ErrorAction SilentlyContinue
          }
          @(
            "KHARVOX VR - RETAIL PREVIEW (EXPERIMENTAL)"
            "Source: ${{ github.sha }}"
            "Native commit: $env:NATIVE_COMMIT"
            "Native workflow run: $env:NATIVE_RUN_ID"
            "Original KHARVOX by CactusVRStudios: https://github.com/CactusVRStudios/KHARVOX"
            "VR modifications: MrEGS_"
            ""
            "Run KharvoxLauncher.exe and select your DOOM (2016) installation."
            "All VR mod controls and calibration are inside the headset."
            "The desktop Mod Manager, updater and automatic patcher are retired."
            "Keep existing UserData when upgrading; do not overwrite it."
            "Experimental build; headset verification is required before release."
          ) | Set-Content -LiteralPath (Join-Path $root "README-RETAIL-PREVIEW.txt") -Encoding UTF8
          @("KHARVOX_RETAIL_PREVIEW_1","commit=${{ github.sha }}","nativeCommit=$env:NATIVE_COMMIT","nativeRun=$env:NATIVE_RUN_ID") | Set-Content -LiteralPath (Join-Path $root "RETAIL-BUILD.txt") -Encoding ASCII
          foreach ($forbidden in @("KharvoxVRModManager.exe","KharvoxVRModManagerUpdater.exe","Get-KHARVOX-Custom-Watcher.ps1")) {
            if (Get-ChildItem -LiteralPath $root -Filter $forbidden -File -Recurse) { throw "Forbidden updater/mod executable included: $forbidden" }
          }

      - name: Regression-test launcher, profile and preserved mod defaults
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/KHARVOX-Retail-Preview/KharvoxLauncher.exe"
          foreach ($test in @("--self-test-retail-mods","--self-test-mregs-profile","--self-test-shoulder-weapon-lock","--self-test-virtual-gunstock-lock","--self-test-cactus-launcher")) {
            & $exe $test
            if ($LASTEXITCODE -ne 0) { throw "Retail launcher regression $test failed ($LASTEXITCODE)" }
          }
          if ((git hash-object launcher/KharvoxLauncher/MainForm.cs).Trim() -ne "fdfdd46536a68853612b7ce5a0d2418541a60586") { throw "Cactus MainForm.cs must remain byte-for-byte unmodified." }

      - name: Zip the KHARVOX-only install
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist/KHARVOX-Retail-Preview"
          $zip = Join-Path $PWD "dist/KHARVOX-Retail-Preview.zip"
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$sha *KHARVOX-Retail-Preview.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII
          "Single KHARVOX launcher, native VR runtime, no manager or updater." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload experimental KHARVOX retail preview
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-Retail-Preview-Experimental
          path: |
            dist/KHARVOX-Retail-Preview.zip
            dist/KHARVOX-Retail-Preview.zip.sha256
          if-no-files-found: error
          retention-days: 30
