name: Standalone VR Mods (external, no launcher rebuild)
on:
  push:
    branches:
      - work/standalone-gesture-wheel-quick-holsters
    paths:
      - 'standalone-mods/**'
      - '.github/workflows/standalone-vr-mods.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Configure standalone mod DLLs only
        run: cmake -S standalone-mods -B standalone-mods/build -A x64
      - name: Build DLLs separately from KHARVOX
        run: cmake --build standalone-mods/build --config Release --parallel
      - name: Run independent DLL load and gameplay-policy tests
        run: ctest --test-dir standalone-mods/build -C Release --output-on-failure
      - name: Stage separately installable packages
        shell: pwsh
        run: |
          $folder = "standalone-mods/build/mods/vr/Release"
          if (!(Test-Path $folder)) { $folder = "standalone-mods/build/mods/vr" }
          New-Item -ItemType Directory -Force -Path "dist/behind-head-weapon-wheel", "dist/dynamic-quick-holsters" | Out-Null
          Copy-Item -LiteralPath (Join-Path $folder "kharvox_mod_behind_head_wheel.dll") -Destination "dist/behind-head-weapon-wheel/"
          Copy-Item -LiteralPath (Join-Path $folder "kharvox_mod_quick_holsters.dll") -Destination "dist/dynamic-quick-holsters/"
          Copy-Item -LiteralPath "standalone-mods/behind-head-wheel/mod.json" -Destination "dist/behind-head-weapon-wheel/"
          Copy-Item -LiteralPath "standalone-mods/dynamic-quick-holsters/mod.json" -Destination "dist/dynamic-quick-holsters/"
          Copy-Item -LiteralPath "standalone-mods/README.md" -Destination "dist/behind-head-weapon-wheel/"
          Copy-Item -LiteralPath "standalone-mods/README.md" -Destination "dist/dynamic-quick-holsters/"
      - name: Publish Behind-the-Head Weapon Wheel module
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-MOD-Behind-the-Head-Weapon-Wheel
          path: dist/behind-head-weapon-wheel/*
          if-no-files-found: error
      - name: Publish Dynamic Quick Holsters module
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-MOD-Dynamic-Quick-Holsters
          path: dist/dynamic-quick-holsters/*
          if-no-files-found: error
