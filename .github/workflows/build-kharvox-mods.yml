name: KHARVOX Retail Preview (Experimental)

on:
  push:
    branches: [feature/onehand-physical-recoil-calibration]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'config/user_calibration_defaults/**'
      - 'launcher/KharvoxLauncher/**'
      - 'launcher/KharvoxMods/**'
      - 'launcher/KharvoxModsUpdater/**'
      - 'supervisor/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build-custom.yml'
      - '.github/workflows/build-kharvox-mods.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kharvox-retail-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-preview:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source and full provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest matching successful native build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ github.ref_name }}"
          if ($branch -ne "feature/onehand-physical-recoil-calibration") { throw "Unexpected retail preview source branch." }
          $repo = "${{ github.repository }}"
          $nativePaths = @("src","tests","CMakeLists.txt","config/user_calibration_defaults","launcher/KharvoxLauncher","supervisor","tools","assets",".github/workflows/build-custom.yml")
          $selected = $null
          for ($attempt = 1; $attempt -le 120 -and $null -eq $selected; $attempt++) {
            $raw = gh run list --repo $repo --workflow build-custom.yml --branch $branch --limit 100 --json databaseId,headSha,headBranch,conclusion,status
            if ($LASTEXITCODE -ne 0) { throw "Cannot query KHARVOX native builds." }
            foreach ($candidate in @($raw | ConvertFrom-Json)) {
              if ($candidate.headBranch -ne $branch -or $candidate.conclusion -ne "success") { continue }
              git merge-base --is-ancestor $candidate.headSha "${{ github.sha }}"
              if ($LASTEXITCODE -ne 0) { continue }
              git diff --quiet $candidate.headSha "${{ github.sha }}" -- $nativePaths
              if ($LASTEXITCODE -eq 0) { $selected = $candidate; break }
            }
            if ($null -eq $selected) { Write-Host "Waiting for a green same-source native build: $attempt/120"; Start-Sleep -Seconds 15 }
          }
          if ($null -eq $selected) { throw "No successful matching native build; refusing to package stale gameplay." }
          "NATIVE_RUN_ID=$($selected.databaseId)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NATIVE_COMMIT=$($selected.headSha)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified native build $($selected.databaseId) at $($selected.headSha)"

      - name: Assemble single-launcher KHARVOX package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $PWD "dist/KHARVOX-Retail-Preview"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $metadata = gh run view $env:NATIVE_RUN_ID --repo "${{ github.repository }}" --json headSha,headBranch,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.conclusion -ne "success" -or $metadata.headSha -ne $env:NATIVE_COMMIT -or $metadata.headBranch -ne "${{ github.ref_name }}") { throw "Native source verification failed." }
          gh run download $env:NATIVE_RUN_ID --repo "${{ github.repository }}" --name KHARVOX-Full-Build --dir $root
          if ($LASTEXITCODE -ne 0) { throw "Verified native runtime download failed." }
          foreach ($required in @("KharvoxLauncher.exe","KharvoxLayer.dll","KharvoxLayer.json","PATCH-BUILD.txt","PATCH-MANIFEST.json","native_sfs_build.txt","KharvoxSupervisor.exe")) {
            if (!(Test-Path -LiteralPath (Join-Path $root $required))) { throw "Missing essential native runtime file: $required" }
          }
          $stamp = Get-Content -LiteralPath (Join-Path $root "PATCH-BUILD.txt") -Raw
          $provenance = Get-Content -LiteralPath (Join-Path $root "PATCH-MANIFEST.json") -Raw | ConvertFrom-Json
          if (!$stamp.Contains("KHARVOX_CUSTOM_WATCHER_1") -or !$stamp.Contains("kind=full") -or !$stamp.Contains("commit=$env:NATIVE_COMMIT") -or $provenance.kind -ne "full" -or $provenance.commit -ne $env:NATIVE_COMMIT -or $provenance.branch -ne "${{ github.ref_name }}") { throw "Native SHA/branch manifest mismatch." }
          if (Test-Path -LiteralPath (Join-Path $root "UserData")) { throw "Developer UserData was bundled unexpectedly." }
          if (Test-Path -LiteralPath (Join-Path $root "NativeBridge")) { throw "Legacy manager NativeBridge wrapper was bundled." }
          $factory = Join-Path $root "CalibrationDefaults"
          New-Item -ItemType Directory -Force -Path $factory | Out-Null
          $defaults = @(Get-ChildItem -LiteralPath "config/user_calibration_defaults" -File)
          if ($defaults.Count -ne 7) { throw "Missing owner-calibrated factory settings." }
          foreach ($file in $defaults) {
            $target = Join-Path $factory $file.Name
            if (Test-Path -LiteralPath $target) {
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash) { throw "Factory file conflict: $($file.Name)" }
            } else { Copy-Item -LiteralPath $file.FullName -Destination $target }
          }
          foreach ($obsolete in @("Get-KHARVOX-Custom-Watcher.ps1","KharvoxVRModManager.exe","KharvoxVRModManagerUpdater.exe","KharvoxModsBridge.v1","PATCH-BUILD.txt","PATCH-MANIFEST.json")) {
            Remove-Item -LiteralPath (Join-Path $root $obsolete) -Force -ErrorAction SilentlyContinue
          }
          # A lightweight CUSTOM ADD-ON, not a complete KHARVOX re-release.
          # The user must select the already-installed original KHARVOX on
          # first launch. Runtime references its original 75 SFS shaders.
          $originalShaders = Join-Path $root "sfs-profile"
          if (!(Test-Path -LiteralPath $originalShaders) -or
              @(Get-ChildItem -LiteralPath $originalShaders -Filter *.spv -File).Count -ne 75) {
            throw "Verified native package lacks the expected original 75 SFS shaders."
          }
          Remove-Item -LiteralPath $originalShaders -Recurse -Force
          # Strip C++ debug symbols and link-only output, retaining all DLLs,
          # EXEs, licenses, runtime configs, assets and helper utilities.
          $devExtensions = @(".pdb",".lib",".exp",".ilk",".idb",".iobj",".ipch")
          $devFiles = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $devExtensions -contains $_.Extension.ToLowerInvariant() })
          foreach ($file in $devFiles) {
            Write-Host "Removed development-only file: $($file.FullName.Substring($root.Length+1))"
            Remove-Item -LiteralPath $file.FullName -Force
          }
          # Retail-only layout: never rearrange the native developer build.
          # Keep executable companions and Vulkan layer manifest at the root.
          $config = Join-Path $root "Config"
          $shaders = Join-Path $root "Shaders"
          $licenses = Join-Path $root "Licenses"
          New-Item -ItemType Directory -Force -Path $config,$shaders,$licenses | Out-Null
          $runtimeConfigs = @(
            "hand_models.cfg",
            "hand_models_calibration_default.cfg",
            "hud_flat_calibration_default.cfg",
            "hud_profile_calibration_default.cfg",
            "hud_quad_scale_default.cfg",
            "offhand_hud_default.cfg",
            "two_hand_weapon_profiles_default.cfg",
            "weapon_pitch_default.cfg",
            "weapon_roll_default.cfg",
            "weapon_yaw_default.cfg",
            "KharvoxSupervisor.json"
          )
          $runtimeShaders = @("Fsr1Easu.spv","Fsr1Rcas.spv","HandPbr.frag.spv","HandPbr.vert.spv")
          foreach ($name in $runtimeConfigs) {
            $from = Join-Path $root $name
            if (!(Test-Path -LiteralPath $from)) { throw "Required retail config missing: $name" }
            Move-Item -LiteralPath $from -Destination (Join-Path $config $name)
          }
          foreach ($name in $runtimeShaders) {
            $from = Join-Path $root $name
            if (!(Test-Path -LiteralPath $from)) { throw "Required retail shader missing: $name" }
            Move-Item -LiteralPath $from -Destination (Join-Path $shaders $name)
          }
          $upstreamLicenses = Join-Path $root "sfs-compiler-licenses"
          if (!(Test-Path -LiteralPath $upstreamLicenses)) {
            throw "Third-party SFS licenses were missing."
          }
          foreach ($file in @(Get-ChildItem -LiteralPath $upstreamLicenses -File)) {
            Move-Item -LiteralPath $file.FullName -Destination (Join-Path $licenses $file.Name)
          }
          Remove-Item -LiteralPath $upstreamLicenses -Recurse -Force
          $sourceNotice = Join-Path $root "SFS-PROFILE-SOURCE.txt"
          if (Test-Path -LiteralPath $sourceNotice) {
            Move-Item -LiteralPath $sourceNotice -Destination (Join-Path $licenses "SFS-PROFILE-SOURCE.txt")
          }
          foreach ($obsoleteFolder in @("Docs","tools","supervisor-profiles")) {
            $old = Join-Path $root $obsoleteFolder
            if (Test-Path -LiteralPath $old) { Remove-Item -LiteralPath $old -Recurse -Force }
          }
          # Embedded in KharvoxLauncher.exe; loose copy has no retail consumer.
          $redundantArtwork = Join-Path $root "assets/branding/quest-controller-mapping.png"
          if (Test-Path -LiteralPath $redundantArtwork) {
            Remove-Item -LiteralPath $redundantArtwork -Force
          }
          $redundantArtworkFolder = Join-Path $root "assets/branding"
          if ((Test-Path -LiteralPath $redundantArtworkFolder) -and
              @(Get-ChildItem -LiteralPath $redundantArtworkFolder -Force).Count -eq 0) {
            Remove-Item -LiteralPath $redundantArtworkFolder -Force
          }
          # No second readme or retail build stamp at the top level: setup
          # guidance is in the first-run dialog, provenance in GitHub Actions.
          # Rename only the retail launcher, never the original Cactus binary.
          $oldLauncher = Join-Path $root "KharvoxLauncher.exe"
          $retailLauncher = Join-Path $root "KHARVOX-MrEGS.exe"
          if (!(Test-Path -LiteralPath $oldLauncher)) {
            throw "Original native-built launcher missing."
          }
          Move-Item -LiteralPath $oldLauncher -Destination $retailLauncher
          $oldAppConfig = Join-Path $root "KharvoxLauncher.exe.config"
          if (Test-Path -LiteralPath $oldAppConfig) {
            Move-Item -LiteralPath $oldAppConfig -Destination (Join-Path $root "KHARVOX-MrEGS.exe.config")
          }
          if ((Test-Path -LiteralPath $oldLauncher) -or !(Test-Path -LiteralPath $retailLauncher)) {
            throw "Retail executable rename failed."
          }
          if ((Test-Path -LiteralPath (Join-Path $root "README-RETAIL-PREVIEW.txt")) -or
              (Test-Path -LiteralPath (Join-Path $root "RETAIL-BUILD.txt"))) {
            throw "Obsolete retail text files were unexpectedly packaged."
          }
          <# Original retail README (retired):
          @(
            "KHARVOX VR - RETAIL PREVIEW (EXPERIMENTAL)"
            "Source: ${{ github.sha }}"
            "Native commit: $env:NATIVE_COMMIT"
            "Native workflow run: $env:NATIVE_RUN_ID"
            "Original KHARVOX by CactusVRStudios: https://github.com/CactusVRStudios/KHARVOX"
            "VR modifications: MrEGS_"
            ""
            "PREREQUISITE: Download and install the original CactusVRStudios KHARVOX first."
            "Original download: https://github.com/CactusVRStudios/KHARVOX"
            "On first launch, select the original KharvoxLauncher.exe in its installed folder."
            "The original installation supplies SFS shader files; it is never overwritten."
            "Run our KharvoxLauncher.exe, then select your DOOM (2016) installation."
            "All VR mod controls and calibration are inside the headset."
            "Immutable default configuration: Config/. Graphics shader binaries: Shaders/."
            "Owner presets: CalibrationDefaults/. Copyright notices: Licenses/."
            "The desktop Mod Manager, updater and automatic patcher are retired."
            "Keep existing UserData when upgrading; do not overwrite it."
            "Experimental build; headset verification is required before release."
          ) | Set-Content -LiteralPath (Join-Path $root "README-RETAIL-PREVIEW.txt") -Encoding UTF8
          @("KHARVOX_RETAIL_PREVIEW_1","commit=${{ github.sha }}","nativeCommit=$env:NATIVE_COMMIT","nativeRun=$env:NATIVE_RUN_ID") | Set-Content -LiteralPath (Join-Path $root "RETAIL-BUILD.txt") -Encoding ASCII
          #>
          foreach ($name in $runtimeConfigs) {
            if (!(Test-Path -LiteralPath (Join-Path $config $name)) -or
                (Test-Path -LiteralPath (Join-Path $root $name))) {
              throw "Incorrect config packaging path: $name"
            }
          }
          foreach ($name in $runtimeShaders) {
            if (!(Test-Path -LiteralPath (Join-Path $shaders $name)) -or
                (Test-Path -LiteralPath (Join-Path $root $name))) {
              throw "Incorrect shader packaging path: $name"
            }
          }
          foreach ($name in @("SPIRV-Cross.txt","glslang.txt","SPIRV-Tools.txt")) {
            if (!(Test-Path -LiteralPath (Join-Path $licenses $name))) {
              throw "Required license file missing: $name"
            }
          }
          foreach ($old in @("Docs","supervisor-profiles","tools","sfs-compiler-licenses")) {
            if (Test-Path -LiteralPath (Join-Path $root $old)) {
              throw "Obsolete retail folder still packaged: $old"
            }
          }
          foreach ($forbidden in @("KharvoxVRModManager.exe","KharvoxVRModManagerUpdater.exe","Get-KHARVOX-Custom-Watcher.ps1")) {
            if (Get-ChildItem -LiteralPath $root -Filter $forbidden -File -Recurse) { throw "Forbidden updater/mod executable included: $forbidden" }
          }
          if (Test-Path -LiteralPath (Join-Path $root "sfs-profile")) {
            throw "Original KHARVOX SFS shader assets must not be bundled in the lightweight add-on."
          }
          $remainingDev = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { @(".pdb",".lib",".exp",".ilk",".idb",".iobj",".ipch") -contains $_.Extension.ToLowerInvariant() })
          if ($remainingDev.Count -ne 0) {
            throw "Debug and linker files were left in the retail add-on."
          }

      - name: Regression-test launcher, profile and preserved mod defaults
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/KHARVOX-Retail-Preview/KHARVOX-MrEGS.exe"
          foreach ($test in @("--self-test-retail-mods","--self-test-original-kharvox","--self-test-cactus-hand-hud","--self-test-mregs-profile","--self-test-shoulder-weapon-lock","--self-test-virtual-gunstock-lock","--self-test-cactus-launcher")) {
            # WinExe doesn't reliably set LASTEXITCODE when invoked with & in
            # PowerShell 7. This matches the verified native Windows CI tests.
            $process = Start-Process -FilePath $exe -ArgumentList $test -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "Retail launcher regression $test failed ($($process.ExitCode))" }
          }
          if ((git hash-object launcher/KharvoxLauncher/MainForm.cs).Trim() -ne "fdfdd46536a68853612b7ce5a0d2418541a60586") { throw "Cactus MainForm.cs must remain byte-for-byte unmodified." }

      - name: Zip the KHARVOX-only install
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist/KHARVOX-Retail-Preview"
          $zip = Join-Path $PWD "dist/KHARVOX-Retail-Preview.zip"
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$sha *KHARVOX-Retail-Preview.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII
          "Lightweight KHARVOX add-on: original Cactus installation required, first-run picker, original SFS shaders referenced, no manager/updater/debug symbols." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload experimental KHARVOX retail preview
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-Retail-Preview-Experimental
          path: |
            dist/KHARVOX-Retail-Preview.zip
            dist/KHARVOX-Retail-Preview.zip.sha256
          if-no-files-found: error
          retention-days: 30
